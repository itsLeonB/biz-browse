name: Credential-free PR preview build

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  identity:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      record: ${{ steps.identity.outputs.record }}
    steps:
      - name: Check out trusted default branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate live PR and record identity
        id: identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_MAPPINGS: .github/preview-mappings
        run: |
          record=$(node scripts/preview-identity.mjs)
          echo "record=$record" >> "$GITHUB_OUTPUT"

  build:
    needs: identity
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Validate PR and mapping
        env:
          REPOSITORY: ${{ github.repository }}
          MAPPING_SHA256: ${{ fromJSON(needs.identity.outputs.record).mapping_sha256 }}
        run: |
          [[ "$MAPPING_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(sha256sum "trusted/.github/preview-mappings/pr-${{ github.event.number }}.json" | cut -d ' ' -f 1)" = "$MAPPING_SHA256"
          node trusted/scripts/preview-build-entry.mjs "$GITHUB_EVENT_PATH" trusted/.github/preview-mappings "$REPOSITORY" "$RUNNER_TEMP/preview-clerk-key" > "$RUNNER_TEMP/preview-wrangler.json"
      - name: Check out PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ fromJSON(needs.identity.outputs.record).head_sha }}
          path: application
          persist-credentials: false
      - name: Prepare exact source and isolated output
        env:
          HEAD_SHA: ${{ fromJSON(needs.identity.outputs.record).head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C application rev-parse HEAD)" = "$HEAD_SHA"
          mkdir "$RUNNER_TEMP/source" "$RUNNER_TEMP/build-output"
          git -C application archive "$HEAD_SHA" | tar -x -C "$RUNNER_TEMP/source"
          sudo mount -t tmpfs -o size=256m,nr_inodes=4096,nosuid,nodev,noexec tmpfs "$RUNNER_TEMP/build-output"
          chmod 777 "$RUNNER_TEMP/build-output"
      - name: Build in an unprivileged container
        run: |
          set +e
          bash trusted/scripts/preview-container-build.sh "$RUNNER_TEMP/source" "$RUNNER_TEMP/build-output" "$RUNNER_TEMP/preview-wrangler.json" "$RUNNER_TEMP/preview-clerk-key" > /dev/null 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            echo "Isolated preview build failed (exit $status). Docker exit 125 indicates setup failure; 137 may indicate a resource limit. Check the Docker image, build inputs, and resource limits." >&2
            exit 1
          fi
      - name: Package output with trusted code
        run: node trusted/scripts/preview-package.mjs "$RUNNER_TEMP/build-output" "$RUNNER_TEMP/safe-build"
      - name: Upload untrusted build output
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/safe-build
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [identity, build]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: Check out trusted default branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Install locked trusted packaging dependencies
        working-directory: trusted
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download untrusted archive by artifact ID
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" | jq -e \
            --argjson id "$ARTIFACT_ID" --argjson run "$GITHUB_RUN_ID" \
            --arg name "preview-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '.id == $id and .workflow_run.id == $run and .name == $name and .expired == false and .size_in_bytes <= 62914560' > /dev/null
          curl --fail --silent --show-error --location --max-filesize 62914560 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/build.zip"
      - name: Validate archive and package data only
        run: |
          python3 trusted/scripts/preview-unpack.py "$RUNNER_TEMP/build.zip" "$RUNNER_TEMP/build"
          mkdir "$RUNNER_TEMP/preview-package"
          node trusted/scripts/preview-package.mjs "$RUNNER_TEMP/build" "$RUNNER_TEMP/preview-package/files"
      - name: Bind validated manifest and asset hashes
        id: manifest
        run: |
          node trusted/scripts/preview-asset-manifest.mjs "$RUNNER_TEMP/preview-package/files" > "$RUNNER_TEMP/preview-package/manifest.json"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/preview-package/manifest.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload validated preview artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-package
          if-no-files-found: error
          retention-days: 1

  # shortcut: enable only after artifact provenance and remaining deployment controls are enforced.
  deploy:
    if: ${{ false }}
    concurrency:
      group: preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    needs: [identity, package]
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Require trusted package outputs
        env:
          ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
          MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ && "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - name: Download artifact from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/preview-artifact
          run-id: ${{ github.run_id }}
      - name: Recheck identity and mapping
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_MAPPINGS: trusted/.github/preview-mappings
          PREVIEW_IDENTITY: ${{ needs.identity.outputs.record }}
        run: node trusted/scripts/preview-deploy-gate.mjs
      - name: Deploy validated preview artifact
        env:
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_MAPPINGS: trusted/.github/preview-mappings
          PREVIEW_IDENTITY: ${{ needs.identity.outputs.record }}
          PREVIEW_MANIFEST_SHA256: ${{ needs.package.outputs.manifest-sha256 }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node trusted/scripts/preview-deploy-entry.mjs "$GITHUB_EVENT_PATH" trusted/.github/preview-mappings "$REPOSITORY" "$RUNNER_TEMP/preview-artifact/files" "$RUNNER_TEMP/preview-artifact/manifest.json"
