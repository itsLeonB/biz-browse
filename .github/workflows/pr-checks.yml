name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ["format:check", "lint", "typecheck", "build", "test:unit"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  public-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run public HTTP and database tests
        run: ./scripts/test-compose.sh
      - name: Set fork public key
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          PUBLIC_KEY: ${{ vars.TEST_CLERK_PUBLISHABLE_KEY }}
        run: echo "PUBLIC_CLERK_PUBLISHABLE_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
      - name: Set trusted public key
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          PUBLIC_KEY: ${{ secrets.TEST_CLERK_PUBLISHABLE_KEY }}
        run: echo "PUBLIC_CLERK_PUBLISHABLE_KEY=$PUBLIC_KEY" >> "$GITHUB_ENV"
      - name: Run public browser tests
        run: |
          set -eu
          : "${PUBLIC_CLERK_PUBLISHABLE_KEY:?Set TEST_CLERK_PUBLISHABLE_KEY in repository variables for forks or secrets for trusted runs}"
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\n' "$PUBLIC_CLERK_PUBLISHABLE_KEY" > "$dir/env"
          printf 'CLERK_SECRET_KEY=sk_test_REPLACE_ME\nVITE_CLERK_PUBLISHABLE_KEY=%s\nADMIN_USER_IDS=user_first,user_second\n' "$PUBLIC_CLERK_PUBLISHABLE_KEY" > "$dir/dev.vars"
          ENV_FILE="$dir/env" DEV_VARS_FILE="$dir/dev.vars" ./scripts/test-compose.sh --browser-public
      - name: Report fork auth gap
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo 'Authenticated Clerk tests do not run on fork pull requests.' >> "$GITHUB_STEP_SUMMARY"

  authenticated-tests:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TEST_CLERK_SECRET_KEY: ${{ secrets.TEST_CLERK_SECRET_KEY }}
      TEST_CLERK_PUBLISHABLE_KEY: ${{ secrets.TEST_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require all authenticated test credentials
        run: |
          set -eu
          for name in TEST_CLERK_SECRET_KEY TEST_CLERK_PUBLISHABLE_KEY; do
            if [ -z "$(printenv "$name")" ]; then echo "Missing required secret: $name" >&2; exit 1; fi
          done
      - name: Run authenticated HTTP and database tests
        run: npm run test:authenticated
      - name: Run authenticated browser tests
        run: npm run test:browser -- --project=clerk
