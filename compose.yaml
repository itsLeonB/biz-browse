services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: directory_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: directory_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U directory_test -d directory_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./db/001_drafts.sql:/docker-entrypoint-initdb.d/001_drafts.sql:ro
      - ./db/002_photos.sql:/docker-entrypoint-initdb.d/002_photos.sql:ro
      - ./db/003_publication.sql:/docker-entrypoint-initdb.d/003_publication.sql:ro
      - ./db/004_price_details.sql:/docker-entrypoint-initdb.d/004_price_details.sql:ro
      - ./db/005_pending_photo_deletions.sql:/docker-entrypoint-initdb.d/005_pending_photo_deletions.sql:ro
      - ./db/006_photo_deletion_retry.sql:/docker-entrypoint-initdb.d/006_photo_deletion_retry.sql:ro
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3107:3107"
    env_file:
      - path: ${ENV_FILE:-.env.example}
        required: true
    volumes:
      - ${DEV_VARS_FILE:-./.dev.vars.example}:/app/.dev.vars:ro
