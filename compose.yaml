services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: directory_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: directory_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U directory_test -d directory_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://directory_test:local_test_only@db:5432/directory_test
    command: ["npm", "run", "migrate"]
  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3107:3107"
    env_file:
      - path: ${ENV_FILE:-.env.example}
        required: true
    volumes:
      - ${DEV_VARS_FILE:-./.dev.vars.example}:/app/.dev.vars:ro
