services:
  db:
    extends:
      file: compose.yaml
      service: db
  migrate:
    extends:
      file: compose.yaml
      service: migrate
  fixtures:
    image: postgres:18
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: local_test_only
    volumes:
      - ./seeds/test/taxonomy.sql:/fixtures/taxonomy.sql:ro
      - ./seeds/test/directory.sql:/fixtures/directory.sql:ro
    command:
      [
        "sh",
        "-c",
        "psql -v ON_ERROR_STOP=1 -h db -U directory_test -d directory_test -f /fixtures/taxonomy.sql -f /fixtures/directory.sql",
      ]
  app:
    build:
      context: .
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    depends_on:
      fixtures:
        condition: service_completed_successfully
    env_file:
      - path: ${ENV_FILE:-.env.example}
        required: true
    volumes:
      - ${DEV_VARS_FILE:-./.dev.vars.example}:/app/.dev.vars:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3107/api/drafts').catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
  test:
    build:
      context: .
      target: test
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    depends_on:
      app:
        condition: service_healthy
    environment:
      TEST_BASE_URL: http://app:3107
      TEST_DATABASE_URL: postgres://directory_test:local_test_only@db:5432/directory_test
      TEST_MIGRATION_DATABASE_URL: postgres://directory_test:local_test_only@db:5432/directory_test
      TEST_ADMIN_1_SESSION_ID:
      TEST_ADMIN_2_SESSION_ID:
      TEST_OUTSIDER_SESSION_ID:
      TEST_CLERK_SECRET_KEY:
      TEST_AUTHENTICATED:
      TEST_CATEGORY_ID: "1"
      TEST_CITY_ID: "1"
    command: ["npm", "run", "test:integration"]
